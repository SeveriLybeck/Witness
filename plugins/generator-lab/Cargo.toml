[package]
name = "generator-lab"
version = "0.1.0"
edition = "2021"
description = "Generator lab plugin: manifest, presets, consumer inputs, replays through the C# worker (D23, D34, D37)"

# own workspace: excluded from the root one
[workspace]

[dependencies]
serde_json = "1"
model = { path = "../../crates/model" }

[dev-dependencies]
contracts = { path = "../../contracts" }
plugin-host = { path = "../../crates/plugin-host" }
sandbox = { path = "../../crates/sandbox" }
testcontract = { path = "../../crates/testcontract" }
