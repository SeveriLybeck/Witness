<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiny shop</title>
<style>body{font-family:sans-serif;margin:16px}#grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:12px}.card{border:1px solid #888;padding:8px}</style></head>
<body><h1>Tiny shop</h1><div id="grid"></div><script>
fetch('/api/products').then(r=>r.json()).then(ps=>{document.getElementById('grid').innerHTML=ps.map(p=>'<div class="card"><b>'+p.name+'</b><div class="price">'+(p.price/100).toFixed(2)+'</div><button>Add</button></div>').join('');document.body.dataset.ready='1'});
</script></body></html>
