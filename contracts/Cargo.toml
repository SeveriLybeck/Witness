[package]
name = "contracts"
version = "0.1.0"
edition = "2021"
description = "Witness contracts: record schemas, message schemas, fixtures and the bundle validator"

[lib]
path = "src/lib.rs"

[[bin]]
name = "validate"
path = "src/bin/validate.rs"


[dependencies]
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
sha2 = "0.10"
