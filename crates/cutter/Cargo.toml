[package]
name = "cutter"
version = "0.1.0"
edition = "2021"
description = "Witness block cutter: parts, file categories, large comments, blocks, mechanical groups (D29, D31, D33)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cutter"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tree-sitter = "=0.27.2"
tree-sitter-c-sharp = "=0.23.5"

[dev-dependencies]
contracts = { path = "../../contracts" }
