[package]
name = "bundle"
version = "0.1.0"
edition = "2021"
description = "Witness bundle builder: runs pipeline modules, groups rows into differences, applies replays, computes the boundary"

[lib]
path = "src/lib.rs"

[[bin]]
name = "witness"
path = "src/main.rs"

[dependencies]
serde_json = "1"
contracts = { path = "../../contracts" }

[dev-dependencies]
rules = { path = "../rules" }
