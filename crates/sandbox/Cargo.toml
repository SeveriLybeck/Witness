[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"
description = "Witness sandbox runner: bwrap, working copy per commit, shared NuGet cache, build queue (D4, D42, D43)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "sandbox"
path = "src/bin/sandbox.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
contracts = { path = "../../contracts" }
